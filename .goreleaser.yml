version: 2

builds:
  - id: jeep
    main: ./cmd/jeep
    binary: jeep
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: jeep-image
    main: ./cmd/jeep-image
    binary: jeep-image
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: jeep-tts
    main: ./cmd/jeep-tts
    binary: jeep-tts
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: jeep-research
    main: ./cmd/jeep-research
    binary: jeep-research
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
